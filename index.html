<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style id="app-css">
/* 배치: 모바일 한 컬럼(최대 560px) + 하단 탭바. 일정은 지하철 노선도처럼 이어진 정거장, 곧 있는 일정은 출발 전광판, 예약은 절취선 있는 티켓 */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--surface2:#F4F7F9;
  --ink:#14263D;--muted:#57697D;--line:#D2DBE3;
  --accent:#0B7A75;--accent-soft:#D8F0EE;--on-accent:#FFFFFF;
  --signal:#F2B705;--signal-soft:#FFF2C6;
  --good:#1B7F45;--good-soft:#DCF2E5;
  --warn:#A96300;--warn-soft:#FFEACB;
  --bad:#C0352B;--bad-soft:#FBE1DE;
  --board:#0F1D2E;--board-ink:#EAF1F8;--board-amber:#F7C948;--board-dim:#8DA1B6;--board-line:#22354B;
  --l1:#2F6FE4;--l2:#0E9F78;--l3:#E39A00;--l4:#D9483B;--l5:#8B5CF6;--l6:#0596B8;
  --shadow:0 1px 2px rgba(20,38,61,.06),0 8px 22px rgba(20,38,61,.07);
  --scrim:rgba(8,15,25,.55);
  --f-display:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-soft:'Gowun Dodum','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'Jua','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B141F;--surface:#142131;--surface2:#1A293C;
  --ink:#E8EFF6;--muted:#94A7BB;--line:#26374B;
  --accent:#3DC6BA;--accent-soft:#12393B;--on-accent:#04201E;
  --signal:#F2B705;--signal-soft:#3A3010;
  --good:#4CC784;--good-soft:#15352A;
  --warn:#F0A63C;--warn-soft:#3A2911;
  --bad:#F2796F;--bad-soft:#3D1E1C;
  --board:#070F19;--board-dim:#7F94AA;--board-line:#1B2C40;
  --l1:#5C93F5;--l2:#2FC79A;--l3:#F2B227;--l4:#F0695C;--l5:#A78BFA;--l6:#2EBBDB;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B141F;--surface:#142131;--surface2:#1A293C;
  --ink:#E8EFF6;--muted:#94A7BB;--line:#26374B;
  --accent:#3DC6BA;--accent-soft:#12393B;--on-accent:#04201E;
  --signal:#F2B705;--signal-soft:#3A3010;
  --good:#4CC784;--good-soft:#15352A;
  --warn:#F0A63C;--warn-soft:#3A2911;
  --bad:#F2796F;--bad-soft:#3D1E1C;
  --board:#070F19;--board-dim:#7F94AA;--board-line:#1B2C40;
  --l1:#5C93F5;--l2:#2FC79A;--l3:#F2B227;--l4:#F0695C;--l5:#A78BFA;--l6:#2EBBDB;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body.lock{overflow:hidden}
h1,h2,h3,p,dl,dd,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin-inline:auto;padding-inline:16px}
main{padding-block:18px 190px}

/* 상단 바 · 하단 탭 */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:52px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand .bt{font:700 16px/1.2 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--on-accent);flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-inline:8px}
.tb{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font:600 11px/1.2 var(--f-body);cursor:pointer;position:relative}
.tb[aria-current="page"]{color:var(--accent)}
.tb[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.savebar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:29}
.sb-in{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.22)}
.sb-in .dot{width:9px;height:9px;border-radius:50%;background:var(--signal);flex:none}
.sb-in span.tx{flex:1;font:600 13px var(--f-body);min-width:0}
#toast{position:fixed;left:0;right:0;bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font:600 13px/1.4 var(--f-body);box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:100%}

/* 공통 */
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font:700 17px/1.3 var(--f-body);letter-spacing:-.01em}
.sh .more{background:none;border:0;padding:6px 0;font:600 13px var(--f-body);color:var(--accent);cursor:pointer}
.sub{font-size:13px;color:var(--muted)}
.nt{font-size:13px;color:var(--muted);margin-top:4px}
.lab{font:600 11px/1.3 var(--f-body);color:var(--muted);letter-spacing:.02em}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px;border:1.5px dashed var(--line);border-radius:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 14px/1.2 var(--f-body);cursor:pointer;text-decoration:none}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.grow{flex:1}
.lk{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--accent);font:600 12px/1.3 var(--f-body);text-decoration:none;white-space:nowrap}
.lk.pri{background:var(--accent-soft);border-color:transparent}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:1.5px dashed var(--accent);border-radius:12px;background:none;color:var(--accent);font:600 14px var(--f-body);cursor:pointer;margin-top:10px}
.penb{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px 9px;border:1px solid var(--accent);border-radius:99px;background:var(--surface);color:var(--accent);font:600 12px/1.2 var(--f-body);cursor:pointer;flex:none}
.tag{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill{display:inline-block;font:600 11px/1 var(--f-body);padding:4px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.need{background:var(--bad-soft);color:var(--bad)}
.pill.off,.pill.mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none;position:relative}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--ink);font:600 13px/1.2 var(--f-body);cursor:pointer;white-space:nowrap}
.chip b{font:500 12px var(--f-mono);color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:var(--bg);opacity:.75}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-bottom:16px}
.seg button{appearance:none;border:0;background:none;padding:9px;border-radius:9px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bar-t{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar-t.over i{background:var(--bad)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .eb{flex:1;min-width:0}
.row .et{font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-body);color:#fff;background:var(--c)}
.av.dk{color:#1B1300}
.amt{font:600 15px var(--f-mono);white-space:nowrap;text-align:right}
.amt small{font:500 11px var(--f-body);color:var(--muted);margin-left:2px}
.amt.pos{color:var(--good)}
.amt.neg{color:var(--bad)}
.notice{background:var(--signal-soft);border:1px solid var(--signal);border-radius:12px;padding:12px 14px;font-size:14px}
.notice b{display:block;font:700 12px var(--f-body);margin-bottom:2px}
.hint{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}

/* 홈: 여행 티켓 */
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.tk-main{padding:18px 16px}
.tk-dest{font:500 12px var(--f-mono);color:var(--accent);letter-spacing:.06em;margin-bottom:4px}
.tk-main h1{font:400 30px/1.15 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.tk-meta{font:500 14px var(--f-mono);margin-top:10px}
.tk-sub{font-size:13px;color:var(--muted);margin-top:2px}
.tk-stub{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;min-width:104px;border-left:2px dashed var(--line);background:var(--surface2)}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tk-stub::before{top:-11px}
.tk-stub::after{bottom:-11px}
.tk-small{font:600 12px var(--f-body);color:var(--muted)}
.tk-big{font:400 34px/1 var(--f-display);color:var(--accent);white-space:nowrap}

/* 출발 전광판 */
.board{background:var(--board);border-radius:14px;padding:2px 14px;box-shadow:var(--shadow)}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--board-line)}
.brow:first-child{border-top:0}
.b1{color:var(--board-amber);font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.b2{color:var(--board-ink);font:600 14px/1.4 var(--f-body)}
.b2 small{display:block;color:var(--board-dim);font:500 12px var(--f-mono)}
.b3{color:var(--board-dim);font:500 12px var(--f-mono);white-space:nowrap}
.board .none{padding:16px 0;color:var(--board-dim);font-size:14px}

/* 일정: 노선도 */
.route{--dc:var(--l1)}
.stop{display:grid;grid-template-columns:46px 22px minmax(0,1fr);column-gap:10px}
.st{padding-top:11px;text-align:right;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.rl{position:relative}
.rl::before{content:"";position:absolute;left:50%;width:4px;margin-left:-2px;top:0;bottom:0;background:var(--dc)}
.stop:first-child .rl::before{top:20px}
.stop:last-child .rl::before{bottom:auto;height:20px}
.stop:first-child:last-child .rl::before{display:none}
.rl::after{content:"";position:absolute;left:50%;top:12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:4px solid var(--dc)}
.sb{padding:8px 0 20px;min-width:0}
.sb h3{font:600 15px/1.4 var(--f-body);margin-top:6px}
.s1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:5px;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.daynote{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.daynote h2{font:700 18px/1.3 var(--f-body)}

/* 장소 */
.srch{display:flex;gap:8px;margin-bottom:14px}
.srch input{flex:1;min-width:0}
.place.done .pt strong{text-decoration:line-through;color:var(--muted)}
.place.done{opacity:.72}
.place{align-items:flex-start}
.pb{flex:1;min-width:0}
.pt{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ck{flex:none;width:28px;height:28px;margin-top:1px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;cursor:pointer;padding:0}
.ck[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prog{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog .bar-t{flex:1}
.prog span{font:600 13px var(--f-mono);white-space:nowrap}

/* 예약 티켓 */
.tix{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.tix.past{opacity:.62}
.tix-body{padding:14px}
.tix-body h3{font:700 17px/1.35 var(--f-body);margin-top:8px}
.tix.cancel h3{text-decoration:line-through;color:var(--muted)}
.when{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font:500 14px var(--f-mono)}
.when .rel{font:600 12px var(--f-body);color:var(--accent)}
.rt{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:600}
.rt .ln{flex:1;min-width:16px;border-top:2px dotted var(--muted);opacity:.5}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px 14px;margin-top:12px}
.kv dt{font:600 11px var(--f-body);color:var(--muted)}
.kv dd{font:500 14px var(--f-mono);overflow-wrap:anywhere}
.tix-foot{position:relative;border-top:2px dashed var(--line);padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--surface2)}
.tix-foot::before,.tix-foot::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tix-foot::before{left:-11px}
.tix-foot::after{right:-11px}
.code{font:600 14px var(--f-mono);padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);user-select:all}
.io{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-top:12px;padding:12px;background:var(--surface2);border-radius:12px}
.io .tm{display:block;font:600 24px/1.15 var(--f-mono)}
.io .dd{display:block;font:500 13px var(--f-mono);color:var(--muted)}
.io .ar{color:var(--muted)}

/* 경비 */
.bal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.bal .num{font:600 34px/1.15 var(--f-mono);letter-spacing:-.02em;margin-top:2px}
.bal .num small{font:600 15px var(--f-body);margin-left:3px;color:var(--muted)}
.bal .num.neg{color:var(--bad)}
.bal .bar-t{margin-top:14px}
.bal .cap{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat3 b{display:block;font:600 14px var(--f-mono);margin-top:2px;white-space:nowrap}
.cats{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:12px}
.cats i{background:var(--c);min-width:4px}
.catrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.catrow .amt{margin-left:auto;font-size:14px}

function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ui.canEdit=false;ui.edit=false;scheduleRender();return '수정 권한이 없어요. 보기만 할 수 있어요'}

  return '저장하지 못했어요. 다시 해 주세요';
}

function mapSvg(pts,zr){
  const Wd=360,Ht=300,P=36;
  const lat0=pts.reduce((s,p)=>s+p.lat,0)/pts.length,kx=Math.cos(lat0*Math.PI/180);
  const X=p=>p.lng*kx,Y=p=>-p.lat;
  const xs=pts.map(X),ys=pts.map(Y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sw=Math.max(x1-x0,0.004),sh=Math.max(y1-y0,0.004);
  const sc=Math.min((Wd-2*P)/sw,(Ht-2*P)/sh);
  const ox=(Wd-sw*sc)/2-x0*sc,oy=(Ht-sh*sc)/2-y0*sc;
  const pos=p=>[X(p)*sc+ox,Y(p)*sc+oy];
  const days=tripDays();
  let g='';
  for(let i=1;i<4;i++)g+='<line class="grid" x1="0" x2="'+Wd+'" y1="'+(Ht/4*i)+'" y2="'+(Ht/4*i)+'"/>';
  for(let i=1;i<6;i++)g+='<line class="grid" y1="0" y2="'+Ht+'" x1="'+(Wd/6*i)+'" x2="'+(Wd/6*i)+'"/>';
  const di=days.indexOf(ui.day);
  const route=itemsOf(ui.day||'').filter(x=>!x.skip).map(x=>pts.find(p=>p.name===x.place)).filter(Boolean);
  if(route.length>=2)g+='<polyline class="route-l" style="stroke:var(--l'+(((di<0?0:di))%6+1)+')" points="'+route.map(p=>pos(p).map(v=>v.toFixed(1)).join(',')).join(' ')+'"/>';
  const P2=pts.map(p=>({p,xy:pos(p)}));
  const used=P2.map(o=>({x0:o.xy[0]-14,x1:o.xy[0]+14,y0:o.xy[1]-14,y1:o.xy[1]+14}));
  const hit=r=>used.some(u=>r.x0<u.x1&&r.x1>u.x0&&r.y0<u.y1&&r.y1>u.y0);
  P2.forEach(o=>{
    const p=o.p,x=o.xy[0],y=o.xy[1],i=p.day?days.indexOf(p.day):-1,sel=p.id===ui.pin;
    const fill=i>=0?'var(--l'+(i%6+1)+')':'var(--surface)';
    const nm=p.name.length>7?p.name.slice(0,7)+'…':p.name,w=nm.length*11.5;
    let pick=null;
    for(const [an,dx,dy] of [['middle',0,25],['middle',0,-19],['start',17,4],['end',-17,4]]){
      const lx=x+dx,r={x0:an==='middle'?lx-w/2:an==='start'?lx:lx-w,x1:an==='middle'?lx+w/2:an==='start'?lx+w:lx,y0:y+dy-9,y1:y+dy+5};
      if(r.x0>=0&&r.x1<=Wd&&r.y0>=0&&r.y1<=Ht&&!hit(r)){pick={an,lx,ly:y+dy,r};break}
    }
    if(!pick&&sel)pick={an:'middle',lx:x,ly:y+25,r:null};
    if(pick&&pick.r)used.push(pick.r);
    g+='<g class="pin'+(p.done?' done':'')+'" data-act="pin" data-id="'+p.id+'" tabindex="0" role="button" aria-label="'+esc(p.name)+'">'
      +(sel?'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="19" class="ring"/>':'')
      +'<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="12" style="fill:'+fill+'" class="dot'+(i<0?' none':'')+'"/>'
      +'<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" class="n'+(i%6===2?' dk':'')+(i<0?' none':'')+'">'+(i>=0?i+1:'?')+'</text>'
      +(pick?'<text x="'+pick.lx.toFixed(1)+'" y="'+pick.ly.toFixed(1)+'" class="pl-t" style="text-anchor:'+pick.an+'">'+esc(nm)+'</text>':'')+'</g>';
  });
  const km=sw*111.32;
  return '<div class="map"><svg viewBox="0 0 '+Wd+' '+Ht+'" role="img" aria-label="가고 싶은 곳 약도">'+g+'</svg><div class="map-cap"><span>'+(zr?'선택한 곳 반경 '+zr+'km · ':'')+'가로 약 '+(km<10?km.toFixed(1):Math.round(km))+'km</span><span>숫자 = 일정에 넣은 날 · ? = 아직 미정</span></div></div>';
}
function vMap(){
  const pts=S.places.filter(p=>isNum(p.lat)&&isNum(p.lng));
  const no=S.places.length-pts.length;
  let h='';
  if(!pts.length)h+='<div class="empty">지도에 찍을 좌표가 아직 없어요.<br>갈 곳을 수정해서 좌표를 넣거나, Claude에게 장소 목록을 주면 좌표까지 찾아서 넣어 줘요.</div>';
  else{

/* ---------- 화면: 예약·숙소 ---------- */
function tix(b){
  const t=at(b.date,b.time),past=t&&t<new Date(NOW.getTime()-2*36e5),tr=TRANSPORT.includes(b.type);
  const e=t&&b.time&&b.status!=='취소'?{at:t,title:b.title,mins:60,loc:b.place||b.from||'',det:b.code?'예약번호 '+b.code:''}:null;
  let h='<article class="tix'+(past?' past':'')+(b.status==='취소'?' cancel':'')+'"><div class="tix-body"><div class="s1"><span class="tag">'+esc(b.type)+'</span><span class="pill '+pc(b.status)+'">'+esc(b.status)+'</span>'+penBtn('booking',b.id)+'</div><h3>'+esc(b.title)+'</h3><div class="when"><span>'+md(b.date)+(b.time?' '+esc(b.time):'')+'</span>'+(t&&!past&&b.status!=='취소'?'<span class="rel">'+until(t)+'</span>':'')+'</div>';
  if(tr&&(b.from||b.to))h+='<div class="rt"><span>'+esc(b.from||'?')+'</span><span class="ln"></span><span>'+esc(b.to||'?')+'</span></div>';
  else if(b.place)h+='<div class="pl">'+ic('pin',14)+'<span>'+esc(b.place)+'</span></div><div class="acts">'+mapLinks(b.place)+'</div>';
  const kv=[];
  if(b.people)kv.push(['인원',b.people+'명']);
  if(b.seat)kv.push([tr?'좌석':'정보',b.seat]);
  if(Number(b.price)>0)kv.push(['금액',won(b.price)]);
  if(kv.length)h+='<dl class="kv">'+kv.map(x=>'<div><dt>'+x[0]+'</dt><dd>'+esc(x[1])+'</dd></div>').join('')+'</dl>';
  if(b.note)h+='<p class="nt">'+nl(b.note)+'</p>';
  h+='</div>';
  const foot=[];
  if(b.code)foot.push('<span class="code">'+esc(b.code)+'</span><button type="button" class="btn sm" data-act="copy" data-v="'+esc(b.code)+'">번호 복사</button>');
  if(safe(b.link))foot.push(lk(safe(b.link),'예약 페이지','btn sm'));
  if(e)foot.push(lk(gcal(e),ic('cal',14)+'캘린더에 넣기','btn sm'));
  if(foot.length)h+='<div class="tix-foot">'+foot.join('')+'</div>';
  return h+'</article>';
}

async function saveSheet(){
  const sh=ui.sheet;if(!sh||busy)return;
  const F=FORM[sh.kind],v=readForm(F);
  for(const f of F.f){if(f.req&&!v[f.k]){toast(f.l.replace(/ \(.*$/,'')+'을(를) 입력해 주세요');const el=$('#f-'+f.k);if(el)el.focus();return}}
  if(sh.kind==='trip'&&dn(v.end)<dn(v.start)){toast('도착일이 출발일보다 빠를 수 없어요');return}
  busy=true;
  const ok=await guard(async()=>{
    if(sh.kind==='trip'){await DB.doc('trip/main').update(clean(v));return}
    if(sh.kind==='day'){const r=DB.doc('dayNotes/'+sh.id);if(v.note)await r.set({note:v.note});else await r.delete();return}
    if(sh.kind==='place'){const c=parseLL(v.ll);delete v.ll;v.lat=c?c[0]:null;v.lng=c?c[1]:null}
    if(sh.kind==='item'){const old=sh.id?S.items.find(x=>x.id===sh.id):null;if(!old||old.date!==v.date||old.time!==v.time)v.ord=ordAt(v.date,v.time,sh.id)}

    else{if(sh.kind==='place')v.done=false;await W.put(CN(sh.kind),Object.assign({id:uid()},v))}
  });

  if(ok){if(sh.kind==='item')ui.day=v.date;closeSheet();toast('저장했어요')}
}

function parseBulk(t,defKind){
  return t.split(/\n/).map(s=>s.trim()).filter(Boolean).map(line=>{
    const um=line.match(/https?:\/\/\S+/),url=um?um[0]:'';
    let name=line.replace(url,'').replace(/\[[^\]]*\]/g,'').trim(),area='';
    const k=name.split(/\s+[\/|]\s+|\s*[|]\s*/);
    if(k.length>1){name=k[0].trim();area=k.slice(1).join(' ').trim()}
    if(!name)return null;
    const g=/google|goo\.gl/i.test(url),ll=g?parseLL(url):null;
    const kind=/(카페|커피|베이커리|디저트)/.test(name)?'카페':/(식당|맛집|국밥|횟집|칼국수|순두부|냉면|치킨|갈비|해장|찌개|막국수|수산시장|중앙시장|밥집)/.test(name)?'맛집':defKind;
    return {name,kind,area,day:'',naver:(url&&!g)?url:'',note:'',done:false,lat:ll?ll[0]:null,lng:ll?ll[1]:null};
  }).filter(Boolean);
}

/* ---------- 저장소: 이 폰 · 공동 편집(Firebase) · 링크로 받은 화면 ---------- */
const STORE_KEYS=['trip','dayNotes',...COLS];
const emptyStore=()=>{const s={};STORE_KEYS.forEach(k=>{s[k]={}});return s};
function storeFromEmb(){
  const d=JSON.parse(EMB),s=emptyStore();
  if(d.trip)s.trip.main=d.trip;
  Object.keys(d.dayNotes||{}).forEach(k=>{s.dayNotes[k]={note:d.dayNotes[k]}});
  COLS.forEach(c=>(d[c]||[]).forEach(x=>{const r=Object.assign({},x);delete r.id;s[c][x.id]=r}));

}
function stateFromStore(st){
  const s=emptyState();
  s.trip=st.trip&&st.trip.main?Object.assign({},st.trip.main):null;
  Object.keys(st.dayNotes||{}).forEach(k=>{s.dayNotes[k]=(st.dayNotes[k]||{}).note||''});
  COLS.forEach(c=>{s[c]=Object.keys(st[c]||{}).map(id=>Object.assign({id},st[c][id]))});
  return s;
}
const storeOut=st=>{const o={};Object.keys(st).forEach(k=>{if(Object.keys(st[k]||{}).length)o[k]=st[k]});return o};
function makeDB(store,write){
  const subs={};
  const fire=c=>{(subs[c]||[]).forEach(f=>f())};
  const fireAll=()=>Object.keys(subs).forEach(fire);
  const strip=o=>{const r={};for(const k in o){if(o[k]!==null&&o[k]!==undefined)r[k]=o[k]}return r};
  const dref=(c,id)=>({
    onSnapshot(n){const f=()=>{const v=(store[c]||{})[id];n({exists:!!v,id,data:()=>v})};(subs[c]=subs[c]||new Set()).add(f);setTimeout(f,0);return()=>subs[c].delete(f)},
    async set(d){const v=strip(JSON.parse(JSON.stringify(d)));(store[c]=store[c]||{})[id]=v;fire(c);await write('set',c,id,v)},
    async update(d){if(!(store[c]||{})[id])throw {code:'invalid_argument'};const dd=JSON.parse(JSON.stringify(d)),cur=store[c][id];for(const k in dd){if(dd[k]===null)delete cur[k];else cur[k]=dd[k]}fire(c);await write('update',c,id,dd)},
    async delete(){if(store[c])delete store[c][id];fire(c);await write('delete',c,id)}
  });
  const cref=c=>({
    onSnapshot(n){const f=()=>n({docs:Object.keys(store[c]||{}).sort().map(id=>({id,exists:true,data:()=>store[c][id]}))});(subs[c]=subs[c]||new Set()).add(f);setTimeout(f,0);return()=>subs[c].delete(f)},
    doc:id=>dref(c,id)
  });
  return {fire,fireAll,collection:cref,doc:p=>{const i=p.lastIndexOf('/');return dref(p.slice(0,i),p.slice(i+1))}};
}
const HOST_RE=/^(?:[a-z0-9-]+(?:-default-rtdb)?\.(?:firebaseio\.com|[a-z0-9-]+\.firebasedatabase\.app)|localhost:\d+)$/i;
const baseOf=h=>(/^localhost/.test(h)?'http://':'https://')+h;
function parseLink(l){const m=String(l||'').match(/^([^/]+)\/([A-Za-z0-9_-]{8,40})$/);return m&&HOST_RE.test(m[1])?{host:m[1],tid:m[2]}:null}
const randomId=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')};
function remoteDB(host,tid){
  const url=p=>baseOf(host)+'/trips/'+tid+(p?'/'+p:'')+'.json';
  const store=emptyStore();
  let writes=0;
  async function rq(method,p,body){
    try{
      const r=await fetch(url(p),{method,headers:body===undefined?undefined:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
      if(r.status===401||r.status===403)throw {code:'invalid_argument'};
      if(!r.ok)throw {code:'unavailable'};
      return await r.json();
    }catch(e){throw (e&&e.code)?e:{code:'unavailable'}}
  }
  function load(d){
    const n=emptyStore();
    Object.keys(n).forEach(k=>{n[k]=d&&d[k]&&typeof d[k]==='object'?d[k]:{}});
    if(JSON.stringify(n)===JSON.stringify(store))return false;
    Object.keys(store).forEach(k=>delete store[k]);Object.assign(store,n);
    return true;
  }
  const db=makeDB(store,async(op,c,id,data)=>{
    writes++;
    try{
      if(op==='set')await rq('PUT',c+'/'+id,data);
      else if(op==='update')await rq('PATCH',c+'/'+id,data);
      else await rq('DELETE',c+'/'+id);
      LS.set('cache:'+tid,store);
    }catch(e){pull().catch(()=>{});throw e}
    finally{writes--}
  });
  async function pull(first){
    const d=await rq('GET','');
    if(writes>0)return;
    if(load(d)||first){LS.set('cache:'+tid,store);db.fireAll()}
  }
  return {db,pull,store,load,seed:async st=>{await rq('PUT','',storeOut(st))}};
}

const b64u=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>{const s=atob(t.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function pipe(bytes,S_){const s=new S_('deflate-raw'),w=s.writable.getWriter();w.write(bytes);w.close();return new Uint8Array(await new Response(s.readable).arrayBuffer())}
async function encodeSnap(st){
  const bytes=new TextEncoder().encode(JSON.stringify(storeOut(st)));
  return window.CompressionStream?'z'+b64u(await pipe(bytes,CompressionStream)):'p'+b64u(bytes);
}
async function decodeSnap(t){
  const raw=unb64u(t.slice(1));
  const bytes=t[0]==='z'?await pipe(raw,DecompressionStream):raw;
  const d=JSON.parse(new TextDecoder().decode(bytes)),st=emptyStore();
  STORE_KEYS.forEach(k=>{if(d[k]&&typeof d[k]==='object')st[k]=d[k]});
  return st;
}

    +'<details class="how"><summary>데이터베이스 만드는 법</summary><ol><li>firebase.google.com 에 구글 계정으로 들어가 콘솔로 이동, 프로젝트 추가 (이름은 아무거나, 애널리틱스는 꺼도 돼요).</li><li>왼쪽 메뉴 빌드 → Realtime Database → 데이터베이스 만들기 → 잠금 모드로 시작.</li><li>규칙 탭에 아래 글을 통째로 붙여 넣고 게시.</li><li>데이터 탭 맨 위의 주소(https://…firebaseio.com)를 복사해서 위 칸에 붙여 넣기.</li></ol><div class="acts"><button type="button" class="btn sm" data-act="copy" data-v="'+esc(FB_RULES)+'">규칙 글 복사</button></div></details></section>';
  return '';
}
function exportCsv(){
  const rows=[['이름','종류','지역','메모','위도','경도']].concat(S.places.map(p=>[p.name,p.kind,p.area||'',p.note||'',isNum(p.lat)?p.lat:'',isNum(p.lng)?p.lng:'']));
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='places.csv';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('CSV를 저장했어요');
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LIVE)LIVE.pull().catch(()=>{})});

/* ---------- 시작 ---------- */
(async()=>{
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('s=')){
    try{SNAP=await decodeSnap(h.slice(2));S=stateFromStore(SNAP);mode='snap';DB=null;ui.canEdit=false;render();return}
    catch(e){toast('링크를 읽지 못했어요')}
  }
  const l=h.startsWith('f=')?decodeURIComponent(h.slice(2)):LS.get('live',null);
  if(l&&parseLink(l)){LS.set('live',l);await startLive(l);return}
  startLocal();
})();
})();
